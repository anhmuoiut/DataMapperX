/* V6 · focused landing dashboard with two workflows. */
.start-hero{max-width:1000px;margin:32px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:39px 40px 34px;position:relative;overflow:hidden}
.start-hero:after{content:"";position:absolute;width:230px;height:230px;right:-105px;top:-115px;border:45px solid var(--bluebg);border-radius:50%;pointer-events:none;opacity:.65}
.start-hero h1{font-size:clamp(23px,3.2vw,34px);margin:13px 0 12px;letter-spacing:-1px;line-height:1.16;max-width:700px}
.start-hero p{color:var(--muted);font-size:13px;line-height:1.8;max-width:720px;margin:0}
.start-label{color:var(--brand);font-weight:800;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.start-meta{display:flex;align-items:center;gap:9px;margin-top:19px;flex-wrap:wrap}
.start-meta span{font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:6px 11px;color:var(--muted)}
.start-choice-title{max-width:1000px;margin:26px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.start-choice-title strong{font-size:15px}.start-choice-title small{font-size:11px;color:var(--muted)}
.startcards.v6-cards{max-width:1000px;margin:13px auto 0;gap:16px}
.startcards.v6-cards .startcard{min-height:260px;padding:25px;transition:border-color .18s,transform .18s,box-shadow .18s}
.startcards.v6-cards .startcard:hover{transform:translateY(-2px);box-shadow:0 11px 25px #115d9e19}
.startcards.v6-cards .startcard h2{font-size:20px}
.startcards.v6-cards .startcard p{font-size:12px;line-height:1.7}
.start-step{display:inline-block;margin:10px 0 0;font-size:10px;color:var(--muted);background:var(--surface2);border-radius:5px;padding:7px 9px}
.startcard .cta{font-size:12px;display:flex;align-items:center;justify-content:space-between}
.start-foot{max-width:1000px;margin:16px auto 0;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
@media(max-width:720px){.start-hero{padding:26px 20px;margin-top:7px}.startcards.v6-cards{grid-template-columns:1fr}.start-choice-title{flex-direction:column;align-items:flex-start}.startcards.v6-cards .startcard{min-height:220px}}

.about-dialog{width:min(960px,calc(100vw - 26px));max-height:min(810px,calc(100dvh - 36px));overflow:hidden;display:flex;flex-direction:column;padding:0;border-radius:13px;background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:0 24px 80px #12233850}

.about-switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:13px 24px 0}
.about-switch button{min-width:0;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:11px 12px;color:var(--text);font-size:12px;font-weight:650}

.about-content{overflow-y:auto;min-height:90px;flex:1;padding:17px 24px 24px;overscroll-behavior:contain}
.about-intro{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:7px;background:var(--surface2);padding:13px 14px;line-height:1.6;color:var(--muted);margin-bottom:14px}
.about-intro strong{color:var(--text)}
.formula-card{background:var(--surface);border:1px solid var(--line);padding:15px 17px;border-radius:9px;margin:12px 0}
.formula-card h3{font-size:13px;margin:0 0 5px;color:var(--text)}

.about-footer{border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.about-footer small{color:var(--muted);font-size:10px;line-height:1.5;max-width:690px}
.about-table{width:100%;border-collapse:collapse;font-size:12px}
.about-table th,.about-table td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}

const initial=()=>({route:'dashboard',screen:'dashboard',selected:[],source:'EOL Test Log',logSet:'eol',importName:'RawData_demo.xlsx',rawKind:'numeric',mode:'review',reviewTab:'precheck',criteria:{sv:{on:true,pass:10,fail:30},svtol:{on:true,pass:10,fail:30},ndc:{on:true,min:5}},filter:'',scanned:false,ready:false,method:'cap',ran:false,runMethod:null,result:null,resultsTab:'charts',reportName:'ICT Tester 01',reporter:'Test Engineering',reportCharts:true,reportAll:true,selectedReport:[],studyVar:6,grrDesign:'auto',ci:95,dark:false,modal:null,aboutMethod:'cap',aboutTab:'calculation',notice:'',bounds:{},sampleCount:10,trials:3,operatorSet:'single',loadedRaw:false,hasInvalid:false,customFilename:false});
let s=initial();const E=x=>String(x??'').replace(/[&<>"']/g,v=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[v]));const F=n=>n==null?'—':Number(n)===0?'0':Math.abs(n)<.00001?Number(n).toExponential(3).replace('e','E'):Number(n).toLocaleString('en-US',{maximumFractionDigits:6});const bound=(o,k)=>s.bounds[o.id]&&Object.hasOwn(s.bounds[o.id],k)?s.bounds[o.id][k]:o[k];const numeric=o=>o.unit!=='Boolean';const chosen=()=>s.selected.map(byId).filter(Boolean);const width=o=>bound(o,'usl')-bound(o,'lsl');const nrows=()=>s.sampleCount*s.trials;const row=(t,i)=>t.mean+t.spread*(Math.sin((i+1)*1.7+tests.indexOf(t)*.44)*.85+Math.cos(i*.73+tests.indexOf(t)*1.6)*.3);const validLimits=t=>!numeric(t)||(bound(t,'lsl')!=null&&bound(t,'usl')!=null&&Number(bound(t,'usl'))>Number(bound(t,'lsl')));const fmtv=(n)=>n===null?'—':(Math.abs(Number(n))<.00001&&Number(n)!==0)?Number(n).toExponential(3).toUpperCase():F(n);
const aggregate=t=>{if(!numeric(t)||t.sv==null)return {status:'na',why:'Not numeric'};let grades=[];for(let k of ['sv','svtol']){let c=s.criteria[k];if(!c.on)continue;let v=k==='sv'?t.sv:t.svtol;grades.push(v>c.fail?'fail':v>c.pass?'condition':'pass');}if(s.criteria.ndc.on)grades.push(t.ndc<s.criteria.ndc.min?'fail':'pass');if(!grades.length)return {status:'na',why:'Not applied'};return {status:grades.includes('fail')?'fail':grades.includes('condition')?'condition':'pass',why:grades.join(',')};};
const badge=(label,kind='')=>`<span class="badge ${kind}">${label}</span>`;const button=(label,action,cls='btn',extra='')=>`<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;

ect screening.</div>${s.trials<2?'<div class="tip warn mt10">⚠ Readings per sample must be at least 2 for Gage R&R. Capability analysis remains available.</div>':''}`;}

function analysis(){let ok=ready(),name=s.route==='logs'?'From mapped logfile':s.route==='ratings'?'Imported categorical demo':'From existing RawData.xlsx';let compatible=chosen().filter(numeric);return `${title('Configure analysis',s.route==='logs'?'Your selected measurements are carried forward from the mapping step.':'The existing dataset enters analysis directly. Log scanning and measurement selection are skipped.',`${badge(name,'good')}${button('ⓘ About the method','about-method','btn sm')}${button('Change data source','home','btn sm')}`)}<div class="analysis-grid"><div class="panel pad"><div class="ph"><strong>01 · Analysis method</strong></div>${[['cap','Process Capability','Cp · Cpk · Pp · Ppk'],['grr','Variable Gage R&R','%Study Var · %SV/Tol · NDC'],['attribute','Attribute Agreement','PASS / FAIL · Kappa']].map(([id,l,sub])=>`<button class="method-card ${s.method===id?'active':''}" data-action="method" data-method="${id}"><strong>${E(l)}</strong><span>${sub}</span></button>`).join('')}<div class="mt14">${button('ⓘ View formulas and calculations','about-method','btn sm')}</div><div class="tip mt14">No method runs automatically. Select a method, review the configuration, then press <b>Run Analysis</b>.</div></div><div class="panel pad"><div class="setting-list">${methodSettings()}</div></div><div class="panel pad"><div class="ph"><strong>02 · Dataset & readiness</strong>${badge(ok?'Ready to analyze':'Requires attention',ok?'good':'warn')}</div><div class="file-chip"><div><div class="eyebrow">Loaded dataset</div><b>${s.route==='logs'?'Mapped tester readings':s.route==='ratings'?'PassFail_Ratings_demo.csv':E(s.importName)}</b><div class="micro">${s.sampleCount} samples · ${s.trials} trial(s) per sample · ${chosen().length} item(s)</div></div>${s.route==='raw'?`<div>${button('Choose file…','browse-raw','btn sm')}<input id="userRawFile" type="file" accept=".xlsx,.csv" class="sr-only" aria-label="Choose RawData file"></div>`:''}</div>${s.customFilename?'<div class="tip warn mt10">File name selected for UX preview only. Actual workbook is not parsed; Run Analysis still uses synthetic demo data.</div>':''}<div class="tabletool mt14"><strong style="font-size:11px">Test items in this study</strong>${badge(chosen().length+' items')}</div><div class="tblscroll short"><table><thead><tr><th>Test item</th><th>Data</th><th>Limits</th></tr></thead><tbody>${chosen().map(o=>`<tr><td class="ellipsis" title="${E(o.id)}">${E(o.id)}</td><td>${numeric(o)?'Numeric':'Categorical'}</td><td>${numeric(o)?validLimits(o)?badge('Ready','good'):badge('Review','warn'):badge('—')}</td></tr>`).join('')}</tbody></table></div>${ok?`<div class="tip good mt10">✓ Compatible dataset. Run ${s.method==='cap'?'Process Capability':s.method==='grr'?'Gage R&R':'Attribute Agreement'} when ready.${s.method==='grr'&&s.grrDesign==='crossed'?' Appraiser assignments must be verified in production.':''}</div>`:`<div class="tip warn mt10">⚠ ${s.method==='attribute'?'Attribute Agreement requires PASS/FAIL ratings.':!hasNumeric()?'Select a numeric dataset for this method.':s.method==='grr'&&s.trials<2?'Gage R&R requires at least 2 trials per sample.':'Check selected numeric test items and their LSL / USL limits.'}</div><div class="controls mt10">${button(s.method==='attribute'?'Load ratings demo':s.method==='grr'?'Load repeated RawData demo':'Load numeric RawData demo',s.method==='attribute'?'start-ratings':'start-raw','btn sm')}</div>`}</div></div><div class="bottom"><div>${s.route==='logs'?button('← Back to Review & Pre-check','back-review','btn'):''}</div><div class="controls">${button('▶ Run Analysis','run','btn primary',!ok?'disabled':'')}</div></div>`;}
function histogram(o){let h=Array.from({length:16},(_,i)=>Math.max(1,100*Math.exp(-.5*Math.pow((i-7.5)/2.55,2))*(.85+.20*Math.sin(i*2.5))));return `<svg class="chart" viewBox="0 0 600 305" role="img" aria-label="Illustrative Process Capability Histogram"><g stroke="#dce5ef" stroke-width="1">${[0,1,2,3,4].map(i=>`<line x1="53" x2="567" y1="${35+i*51}" y2="${35+i*51}"/>`).join('')}</g>${h.map((v,i)=>`<rect x="${91+i*27}" y="${239-v*1.85}" width="25" height="${v*1.85}" fill="#8dbbe5" opacity=".87"/>`).join('')}<path d="M88 239 C 174 239,209 56,301 56 C393 56,429 239,524 239" fill="none" stroke="#d44747" stroke-width="2.8"/><path d="M88 239 C179 239,212 53,301 52 C392 53,424 239,524 239" fill="none" stroke="#293e54" stroke-width="2" stroke-dasharray="6 5"/><path d="M73 20 V244 M542 20 V244" stroke="#dc4d4d" stroke-width="2" stroke-dasharray="8 6"/><g fill="#687c90" font-size="11" font-family="Segoe UI,Arial"><text x="73" y="15" text-anchor="middle" fill="#c44">LSL</text><text x="542" y="15" text-anchor="middle" fill="#c44">USL</text><text x="73" y="262" text-anchor="middle">${fmtv(bound(o,'lsl'))}</text><text x="301" y="262" text-anchor="middle">${fmtv(o.mean)}</text><text x="542" y="262" text-anchor="middle">${fmtv(bound(o,'usl'))}</text><text x="300" y="292" text-anchor="middle">Measurement (${E(o.unit)})</text></g></svg>`;}
function grrCharts(){return `<div class="chartgrid">${[0,1,2,3].map(n=>`<div><strong style="font-size:11px">${['Components of Variation','R Chart','Measurement by Sample','Xbar Chart'][n]}</strong><svg class="chart" viewBox="0 0 340 200"><g stroke="#dce5ef">${[35,75,115,155].map(y=>`<line x1="30" x2="326" y1="${y}" y2="${y}"/>`).join('')}</g>${n===0?`<rect x="65" y="139" width="40" height="16" fill="#81b2e2"/><rect x="140" y="131" width="40" height="24" fill="#ca5e5e"/><rect x="235" y="40" width="40" height="115" fill="#82b2e3"/>`:`<polyline points="30,${n===1?105:66} 60,93 90,112 120,${n===3?37:58} 150,125 180,72 210,${n===1?145:41} 240,83 270,55 315,95" fill="none" stroke="#117abf" stroke-width="2.7"/>${n===1?'<line x1="30" y1="46" x2="326" y2="46" stroke="#d25c5c"/><line x1="30" y1="103" x2="326" y2="103" stroke="#3d9b7e"/>':''}`}</svg></div>`).join('')}</div>`;}
function attrChart(){return `<div class="chartgrid">${[0,1].map(i=>`<div><b style="font-size:11px">${i?'Appraiser vs Standard':'Within Appraisers'}</b><svg class="chart" viewBox="0 0 320 205"><g stroke="#dbe6ef">${[45,85,125,165].map(y=>`<line x1="35" y1="${y}" x2="305" y2="${y}"/>`).join('')}</g><line x1="172" y1="42" x2="172" y2="164" stroke="#c44" stroke-width="2"/><circle cx="172" cy="71" r="5" fill="#167abc"/><g stroke="#c44" stroke-width="2"><path d="M166 36l12 12m0-12l-12 12M166 158l12 12m0-12l-12 12"/></g><text x="171" y="193" text-anchor="middle" fill="#6a7c90" font-size="11">Appraiser 1</text></svg></div>`).join('')}</div>`;}
function resultMetrics(){return s.runMethod==='cap'?['N','Cp','Cpk','Pp','Ppk']:s.runMethod==='grr'?['%Study Var','%SV/Tol','NDC']:['Within %','vs Standard %','Kappa'];}
function resultData(o){let id=tests.indexOf(o);if(s.runMethod==='cap')return [s.sampleCount,o.cp?.toFixed(2)||'N/A',o.cpk?.toFixed(2)||'N/A',o.pp?.toFixed(2)||'N/A',o.ppk?.toFixed(2)||'N/A'];if(s.runMethod==='grr')return [o.sv?.toFixed(2)||'N/A',o.svtol?.toFixed(2)||'N/A',o.ndc??'N/A'];return [(id%3===0?96.67:100).toFixed(2),(id%3===0?93.33:100).toFixed(2),(id%3===0?.95:1).toFixed(2)];}
function results(){let arr=chosen().filter(o=>s.runMethod==='attribute'||numeric(o));let current=byId(s.result)||arr[0]||tests[0];let met=s.runMethod==='cap'?'Process Capability':s.runMethod==='grr'?'Variable Gage R&R':'Attribute Agreement';return `${title('Analysis results',`Completed demo: ${met}. Inspect a measurement and prepare the report.`,`${badge('Demo numbers · Not validated','warn')}${button('ⓘ About the method','about-method','btn sm')}${button('Edit analysis settings','to-analyze','btn sm')}`)}<div class="result-layout"><div class="panel pad"><div class="ph"><strong>Results table</strong>${badge(arr.length+' item(s)')}</div><div class="tblscroll"><table><thead><tr><th>Test Item</th>${resultMetrics().map(m=>`<th class="num">${m}</th>`).join('')}</tr></thead><tbody>${arr.map(o=>`<tr class="hover-row clickrow ${current.id===o.id?'active':''}" data-action="result-item" data-id="${E(o.id)}"><td class="ellipsis" title="${E(o.id)}">${E(o.id)}</td>${resultData(o).map(v=>`<td class="num">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="tip mt10">Displayed statistical values are synthetic illustration only; actual reports require the validated DataMapperX engine.</div></div><div class="panel pad"><div class="ph"><strong>${E(current.id)}</strong>${badge(met)}</div><div class="tabs" style="margin-bottom:10px"><button class="tab ${s.resultsTab==='charts'?'active':''}" data-action="results-tab" data-tab="charts">Charts</button><button class="tab ${s.resultsTab==='details'?'active':''}" data-action="results-tab" data-tab="details">Details</button><button class="tab ${s.resultsTab==='checks'?'active':''}" data-action="results-tab" data-tab="checks">Checks</button></div>${s.resultsTab==='charts'?(s.runMethod==='cap'?histogram(current):s.runMethod==='grr'?grrCharts():attrChart()):s.resultsTab==='details'?`<div class="tblscroll"><table><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>${resultMetrics().map((m,i)=>`<tr><td>${m}</td><td>${resultData(current)[i]}</td></tr>`).join('')}</tbody></table></div>`:`<div class="tip good">No critical errors in this demonstration. Production analysis should show actual data-quality checks and warnings here.</div>`}</div></div><div class="bottom"><div class="small">Select any result row to update the charts and details.</div>${button('Prepare statistical report →','to-report','btn primary')}</div>`;}
function paper(){let arr=chosen().filter(o=>s.runMethod==='attribute'||numeric(o));let o=byId(s.result)||arr[0]||tests[0];let method=s.runMethod==='cap'?'Process Capability':s.runMethod==='grr'?'Gage R&R':'Assessment Agreement';return `<div class="paper" id="reportPaper"><h2>${method} Report for ${E(o.id)}</h2><div class="pdsub">Gage name: ${E(s.reportName)}<br>Date of study: 02-11-2026<br>Reported by: ${E(s.reporter)}</div>${s.reportCharts?`<div class="pdrow"><div><h3>${s.runMethod==='cap'?'Process Data':'Study Data'}</h3>Sample N: ${s.sampleCount}<br>Repeat: ${s.trials}<br>LSL: ${fmtv(bound(o,'lsl'))}<br>USL: ${fmtv(bound(o,'usl'))}</div><div>${s.runMethod==='cap'?histogram(o):`<div style="color:#0b61a9;border:1px solid #d6e2ec;padding:55px 8px;text-align:center">${s.runMethod==='grr'?'Gage R&R · Charts':'Agreement · Charts'}</div>`}</div><div><h3>Key indices</h3>${s.runMethod==='cap'?`Cp: ${o.cp}<br>Cpk: ${o.cpk}<br>Pp: ${o.pp}<br>Ppk: ${o.ppk}`:'See summary below'}</div></div>`:''}<h3>Summary</h3><table><thead><tr><th>Test item</th>${resultMetrics().map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${arr.slice(0,8).map(t=>`<tr><td>${E(t.id)}</td>${resultData(t).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table><p style="font-size:9px;color:#758398;margin-top:16px">INTERACTIVE DESIGN MOCKUP — synthetic results, not a validated analysis report.</p></div>`;}
function report(){return `${title('Generate report','Complete study details, preview the Minitab-style report and choose an output.',badge('Preview available','good'))}<div class="report-grid"><div class="panel pad"><div class="ph"><strong>Study information</strong></div>${setInput('Gage / Equipment name','reportName',s.reportName)}${setInput('Reported by','reporter',s.reporter)}<div class="field"><label>Study date</label><input readonly value="02-11-2026"></div><div class="line"></div><strong style="font-size:12px">Include</strong><label class="check"><input type="checkbox" data-check="reportCharts" ${s.reportCharts?'checked':''}> Charts</label><label class="check"><input type="checkbox" data-check="reportAll" ${s.reportAll?'checked':''}> All analyzed measurements</label><div class="line"></div><strong style="font-size:12px">Export</strong><div class="controls mt10">${button('Print / Save PDF…','print-report','btn primary')}${button('↓ Report CSV demo','report-export','btn')}</div><div class="tip mt14">Print opens the browser's PDF dialog; CSV contains synthetic summary values. The real PySide6 application should generate validated PDF and Excel (.xlsx) outputs.</div></div><div class="panel pad" style="background:var(--surface2)"><div class="ph"><strong>Live report preview</strong>${badge('Page 1 · Illustrative')}</div>${paper()}</div></div><div class="bottom">${button('← Back to Results','to-results','btn')}<span class="small">Minitab-style report structure retained.</span></div>`;}
function criteriaDialog(){let c=s.criteria;return `<div class="overlay"><div class="dialog"><div class="ph"><div><h2>GR&R Pre-check · Quick Check criteria</h2><p class="small">Used to color the preliminary screening table. This does not change formal GR&R calculations.</p></div>${button('×','close-modal','btn sm')}</div><div class="criteriarow" style="font-weight:750;color:var(--muted)"><span>Metric</span><small>PASS up to</small><small>FAIL above</small><small>Apply</small></div>${[['sv','%Study Var'],['svtol','%SV/Tol']].map(([k,l])=>`<div class="criteriarow"><span>${l}</span><input aria-label="${l} PASS up to" data-criteria="${k}.pass" type="number" min="0" max="100" value="${c[k].pass}"><input aria-label="${l} FAIL above" data-criteria="${k}.fail" type="number" min="0" max="100" value="${c[k].fail}"><input aria-label="Apply ${l}" data-criteria="${k}.on" type="checkbox" ${c[k].on?'checked':''}></div>`).join('')}<div class="criteriarow"><span>NDC (minimum)</span><input aria-label="Minimum NDC" data-criteria="ndc.min" type="number" min="1" max="100" value="${c.ndc.min}"><span class="small">Below minimum = FAIL</span><input aria-label="Apply NDC" data-criteria="ndc.on" type="checkbox" ${c.ndc.on?'checked':''}></div><div class="tip mt14">Enabled metrics: a value up to PASS = PASS, greater than PASS through FAIL = CONDITION, greater than FAIL = FAIL. NDC below the minimum = FAIL. The overall screening status uses the worst enabled result.</div><div id="criteria-error" class="tip bad mt10" style="display:none"></div><div class="bottom">${button('Reset defaults','criteria-reset','btn') }<div class="controls">${button('Cancel','close-modal','btn')}${button('Apply criteria','criteria-apply','btn primary')}</div></div></div></div>`;}

function formulaCard(name,lines,detail){return `<section class="formula-card"><h3>${name}</h3>${lines.map(line=>`<div class="formula-line">${line}</div>`).join('')}<p>${detail}</p></section>`;}
function aboutCalculation(m){
 if(m==='cap')return `<div class="about-intro"><strong>Normal Process Capability · Cp, Cpk, Pp, Ppk.</strong> Each test item has its own LSL/USL. The application compares short-term (within) and overall variability.</div>
 ${formulaCard('1 · Mean and overall standard deviation',['x̄ = (1/N) Σ x<sub>i</sub>','σ<sub>overall</sub> = √[ Σ(x<sub>i</sub> − x̄)² / (N − 1) ]'],'N = number of measurements. Overall standard deviation includes all observed variation.')}
 ${formulaCard('2 · Within standard deviation',['MR<sub>i</sub> = |x<sub>i</sub> − x<sub>i−1</sub>|','σ<sub>within</sub> = MR̄ / 1.128'],'For individual observations, the engine can use moving ranges of length 2. For rational subgroups, it uses a pooled within-subgroup standard deviation, with an optional c₄ unbiasing factor. These alternatives must not be mixed.')}
 ${formulaCard('3 · Within capability',['Cp = (USL − LSL) / (6σ<sub>within</sub>)','Cpk = min[ (USL − x̄)/(3σ<sub>within</sub>), (x̄ − LSL)/(3σ<sub>within</sub>) ]'],'Cp measures potential spread relative to the tolerance band; Cpk also accounts for centering.')}
 ${formulaCard('4 · Overall capability',['Pp = (USL − LSL) / (6σ<sub>overall</sub>)','Ppk = min[ (USL − x̄)/(3σ<sub>overall</sub>), (x̄ − LSL)/(3σ<sub>overall</sub>) ]'],'Pp and Ppk use the observed overall standard deviation, not the within estimate.')}
 <div class="about-note"><b>Special cases:</b> With a single specification limit, Cp and Pp are N/A. If standard deviation is zero, related indices are N/A. Normality and process stability need separate checks.</div>`;
 if(m==='grr')return `<div class="about-intro"><strong>Variable Gage R&amp;R · balanced one-way ANOVA (single tester).</strong> The formulas below are the one-way calculation documented in the DataMapperX method guide. Crossed studies add Operator and Part × Operator components and must use their separate ANOVA design.</div>
 ${formulaCard('1 · Means',['x̄<sub>i</sub> = (1/r) Σ<sub>j=1…r</sub> x<sub>ij</sub>','x̄̄ = (1/p) Σ<sub>i=1…p</sub> x̄<sub>i</sub>'],'p = samples; r = repeated readings per sample; xᵢⱼ = reading j from sample i.')}
 ${formulaCard('2 · ANOVA sum of squares',['SS<sub>Part</sub> = r Σ<sub>i</sub>(x̄<sub>i</sub> − x̄̄)²','SS<sub>Error</sub> = Σ<sub>i</sub> Σ<sub>j</sub>(x<sub>ij</sub> − x̄<sub>i</sub>)²','SS<sub>Total</sub> = SS<sub>Part</sub> + SS<sub>Error</sub>'],'Degrees of freedom: Part = p − 1; Error = p(r − 1). Mean square = sum of squares / degrees of freedom.')}
 ${formulaCard('3 · Variance components',['σ²<sub>Repeat</sub> = MS<sub>Error</sub>','σ²<sub>Part</sub> = max[(MS<sub>Part</sub> − MS<sub>Error</sub>)/r, 0]','σ²<sub>GRR</sub> = σ²<sub>Repeat</sub>','σ²<sub>Total</sub> = σ²<sub>GRR</sub> + σ²<sub>Part</sub>'],'With one tester, Reproducibility cannot be estimated. The method reports GRR as Repeatability. Negative estimated part variance is set to zero.')}
 ${formulaCard('4 · Study Var, %Study Var, %SV/Tol, NDC',['SV<sub>GRR</sub> = k × σ<sub>GRR</sub> &nbsp; (usually k = 6)','%Study Var = 100 × σ<sub>GRR</sub> / σ<sub>Total</sub>','%SV/Tol = 100 × (k × σ<sub>GRR</sub>) / (USL − LSL)','NDC = max[1, floor(1.41 × σ<sub>Part</sub> / σ<sub>GRR</sub>)]'],'%Study Var uses the ratio of standard deviations; %SV/Tol uses specification width. NDC is undefined if Gage sigma is zero. PASS/CONDITION/FAIL is a separate, configurable screening layer.')}
 <div class="about-note"><b>Crossed studies:</b> measurement = overall mean + Part effect + Operator effect + Part×Operator interaction + Repeatability. Variance components require two-way ANOVA and appropriate handling of the interaction; do not apply the one-way formulas to crossed data.</div>`;
 return `<div class="about-intro"><strong>Attribute Agreement Analysis · categorical PASS/FAIL.</strong> Each appraisal is linked to a Sample, Appraiser and Trial; an independent Standard may be supplied.</div>
 ${formulaCard('1 · Within-appraiser agreement',['Agreement % = 100 × matched samples / inspected samples'],'A sample is a match when its repeated ratings meet the study’s within-appraiser agreement definition. Report the inspected denominator and trial design clearly.')}
 ${formulaCard('2 · Appraiser vs Standard',['vs Standard % = 100 × matched samples / inspected samples'],'The reference Standard is an independent categorical value, not simply the tester’s first rating. Missing or inconsistent Standards must be flagged.')}
 ${formulaCard('3 · Chance-corrected agreement',['κ = (P<sub>o</sub> − P<sub>e</sub>) / (1 − P<sub>e</sub>)'],'Pₒ is observed agreement; Pₑ is agreement expected by chance. DataMapperX reports Fleiss’ Kappa in its Attribute results. The expected-chance term depends on the rating design and categories.')}
 ${formulaCard('4 · Confidence intervals',['CI = interval for the observed agreement proportion'],'The DataMapperX guide describes exact agreement intervals. The displayed confidence level is configurable. The interval is not an independent pass/fail rule.')}
 <div class="about-note"><b>Undefined results:</b> If all ratings fall into one category, some chance-corrected statistics are undefined. They should be shown as N/A, not forced to 0 or 1. Never convert numeric readings into PASS/FAIL without an explicit ratings source or mapping.</div>`;
}
function aboutInterpretation(m){if(m==='cap')return `<div class="about-col2"><div class="about-note"><b>Cp</b> describes potential capability using the within sigma and tolerance width.</div><div class="about-note"><b>Cpk</b> additionally accounts for the sample mean’s distance to the nearest limit.</div><div class="about-note"><b>Pp / Ppk</b> are computed with overall, not within, sigma.</div><div class="about-note"><b>LSL / USL</b> are engineering specification limits, not observed MIN/MAX.</div></div><div class="about-note mt14">An index threshold (for example, Cpk ≥ 1.33) is a user-defined review criterion, not proof of process stability or normality. A reported value also does not establish equivalence with Minitab without comparison testing.</div>`;
if(m==='grr')return `<div class="about-col2"><div class="about-note"><b>%Study Var:</b> share of total standard-deviation variation attributable to the measurement system.</div><div class="about-note"><b>%SV/Tol:</b> the measurement-system study variation compared with the engineering tolerance width.</div><div class="about-note"><b>NDC:</b> how many distinct part categories the measurement system can distinguish (convention-dependent).</div><div class="about-note"><b>One-way vs Crossed:</b> single tester estimates only Repeatability; multiple appraisers can estimate Reproducibility.</div></div><div class="about-note mt14">Pre-check PASS / CONDITION / FAIL thresholds are adjustable. The statistical numbers must remain unchanged when those thresholds change. For the actual application, compare one-way and crossed results separately against verified reference cases.</div>`;
return `<div class="about-col2"><div class="about-note"><b>Within %:</b> whether repeated ratings agree for an appraiser.</div><div class="about-note"><b>vs Standard %:</b> agreement with the known reference labels, when available.</div><div class="about-note"><b>Kappa:</b> agreement adjusted for expected chance agreement.</div><div class="about-note"><b>95% CI:</b> uncertainty interval for the estimated agreement, not a guarantee of 95% future accuracy.</div></div><div class="about-note mt14">Use categorical data with documented Sample ID, Appraiser and Trial mapping. For audits, keep the original ratings, Standard source, analysis configuration, version and exported report together.</div>`;}
function aboutExample(m){if(m==='cap')return `<div class="about-intro"><strong>Worked example — illustrative values only.</strong> These numbers are intentionally self-consistent but are not taken from the currently selected demo measurement.</div><table class="about-table"><tr><th>Input</th><th>Value</th><th>Calculation</th></tr><tr><td>LSL / USL</td><td>9.5 / 10.5</td><td>Tolerance = 1.0</td></tr><tr><td>Mean</td><td>10.1</td><td>Nearest limit distance = 0.4</td></tr><tr><td>Within σ</td><td>0.10</td><td>Cp = 1 / (6 × .1) = 1.667; Cpk = .4 / (.3) = 1.333</td></tr><tr><td>Overall σ</td><td>0.15</td><td>Pp = 1 / (.9) = 1.111; Ppk = .4 / (.45) = .889</td></tr></table>`;
if(m==='grr')return `<div class="about-intro"><strong>Worked example — variance components supplied for demonstration.</strong> No actual ANOVA is run by this HTML.</div><table class="about-table"><tr><th>Input</th><th>Value</th><th>Calculation</th></tr><tr><td>σ<sub>GRR</sub></td><td>0.10</td><td>σ²<sub>GRR</sub> = 0.01</td></tr><tr><td>σ<sub>Part</sub></td><td>0.70</td><td>σ²<sub>Part</sub> = 0.49</td></tr><tr><td>σ<sub>Total</sub></td><td>√0.50 ≈ 0.7071</td><td>%Study Var ≈ 14.14%</td></tr><tr><td>k = 6, Tol = 3.0</td><td>SV<sub>GRR</sub> = 0.60</td><td>%SV/Tol = 20%</td></tr><tr><td>Distinct categories</td><td>floor(1.41 × 0.7 / 0.1)</td><td>NDC = 9</td></tr></table>`;
return `<div class="about-intro"><strong>Worked example — ratings only.</strong> A sample of 30 reference-labeled cases is independently evaluated.</div><table class="about-table"><tr><th>Input</th><th>Value</th><th>Calculation</th></tr><tr><td>Inspected</td><td>30</td><td>Reference-labeled cases</td></tr><tr><td>Matched</td><td>29</td><td>Agreement = 29 / 30 × 100 = 96.67%</td></tr><tr><td>Observed P<sub>o</sub></td><td>0.9667</td><td>For illustration only, assume expected P<sub>e</sub> = 0.50</td></tr><tr><td>Kappa</td><td>0.9334</td><td>(0.9667 − 0.50) / (1 − 0.50)</td></tr></table><div class="about-note mt14">The illustrative Kappa is not the current demo report’s Kappa. A real Fleiss’ Kappa requires the per-category rating counts.</div>`;}
function methodDialog(){let m=s.aboutMethod||s.method||'cap';let names={cap:'Process Capability',grr:'Variable Gage R&R',attribute:'Attribute Agreement'};let sections=[['calculation','Calculation steps'],['meaning','Interpretation'],['example','Worked example']];return `<div class="overlay" role="presentation"><section class="dialog about-dialog" role="dialog" aria-modal="true" aria-labelledby="method-heading"><header class="about-head"><div class="ph"><span class="eyebrow">Statistical method reference</span>${button('×','close-modal','btn sm')}</div><h2 id="method-heading">About the method · ${names[m]}</h2><p>Formulas, meanings and an example you can check manually. This guide does not claim unverified Minitab parity.</p></header><div class="about-switch">${[['cap','Capability · Cp/Cpk'],['grr','Variable Gage R&R'],['attribute','Attribute Agreement']].map(([id,label])=>`<button class="${m===id?'active':''}" data-action="about-method-switch" data-method="${id}">${label}</button>`).join('')}</div><div class="about-tabs">${sections.map(([id,l])=>`<button class="${s.aboutTab===id?'active':''}" data-action="about-tab" data-tab="${id}">${l}</button>`).join('')}</div><div class="about-content">${s.aboutTab==='calculation'?aboutCalculation(m):s.aboutTab==='meaning'?aboutInterpretation(m):aboutExample(m)}</div><footer class="about-footer"><small>Based on the DataMapperX calculation guide for the verified one-way GRR and capability formulas. Attribute and crossed designs need their own validation evidence. <a class="about-link" href="https://github.com/anhmuoiut/DataMapperX/blob/main/datamapperx/method_guide.py" target="_blank" rel="noopener noreferrer">View method guide source</a></small>${button('Close','close-modal','btn primary')}</footer></section></div>`;}

function modal(){return s.modal==='method'?methodDialog():s.modal==='criteria'?criteriaDialog():s.modal==='help'?`<div class="overlay"><div class="dialog"><h2>Prototype instructions</h2><p>The two workflows are interactive. All measurements, pre-check metrics, and results are synthetic. Reports are visual mockups. No login is required. Use About the method for equations.</p>${button('Close','close-modal','btn')}</div></div>`:'';}

function dashboard(){return `<section class="start-hero"><div class="start-label">Engineering workflow · DataMapperX</div><h1>From tester data to clear, consistent reports.</h1><p>DataMapperX helps Test Engineering teams turn ICT, FT and EOL test logs into structured measurement datasets, review values against limits, and run statistical studies with familiar Minitab-style results. Already have prepared RawData? Go straight to analysis without repeating the mapping steps.</p><div class="start-meta"><span>✓ Test log mapping</span><span>✓ Data preview &amp; GR&amp;R pre-check</span><span>✓ Cpk · Gage R&amp;R · Attribute</span><span>✓ Excel / PDF reports</span></div></section><div class="start-choice-title"><strong>Choose your starting point</strong><small>Two entry points · One analysis workspace</small></div><div class="startcards v6-cards"><button class="startcard" data-action="start-logs"><div class="icon">▤</div><div><h2>Map Test Logfiles</h2><p>Start with ICT, FT or EOL tester logs. Select a parsing profile, scan the files, and move measurements from Available to Selected using + / ×. Review the dataset, GR&amp;R pre-check and specification limits, then export RawData or continue to statistical analysis.</p><div class="start-step">Select logs → Map → Review → Export / Analyze</div></div><div class="cta"><span>Start mapping</span><span aria-hidden="true">→</span></div></button><button class="startcard" data-action="start-raw"><div class="icon">▥</div><div><h2>Analyze Existing RawData</h2><p>Have a prepared RawData.xlsx file? Skip scanning and mapping. Import the data, choose Process Capability, Variable Gage R&amp;R or Attribute Agreement as appropriate, then run analysis and generate reports.</p><div class="start-step">Load RawData → Choose method → Results → Report</div></div><div class="cta"><span>Start analysis</span><span aria-hidden="true">→</span></div></button></div><p class="start-foot">UX prototype · Select one of the two workflows to begin. Analysis runs on synthetic sample data only.</p>`;}

function frame(){let stage=s.screen==='dashboard'?dashboard():s.screen==='select'?mapping():s.screen==='review'?review():s.screen==='analyze'?analysis():s.screen==='results'?results():report();return `<div class="app ${s.dark?'dark':''}">${heading()}<main class="main">${s.screen==='dashboard'?'':nav()}${stage}</main><div class="foot"><span>DataMapperX UX V6 · Prototype only — synthetic datasets / illustrative statistics</span><span>Two primary flows · PySide6 redesign reference</span></div>${modal()}${s.notice?`<div class="toast" role="status">${E(s.notice)}</div>`:''}</div>`;}
const root=document.getElementById('root');let noticeTimeout;function render(){root.innerHTML=frame();document.getElementById('print-only').innerHTML=s.screen==='report'?paper():'';}function toast(msg){s.notice=msg;render();clearTimeout(noticeTimeout);noticeTimeout=setTimeout(()=>{s.notice='';render()},3400);}
function initLogs(){s.route='logs';s.screen='select';s.logSet='eol';s.selected=[];s.scanned=false;s.sampleCount=10;s.trials=3;s.ran=false;s.customFilename=false;s.bounds={};s.reviewTab='precheck';s.method='cap';s.notice='';}
function initRaw(mode='numeric'){s.route=mode==='ratings'?'ratings':'raw';s.screen='analyze';s.rawKind=mode;s.importName=mode==='ratings'?'PassFail_Ratings_demo.csv':'RawData_demo.xlsx';s.logSet='ict';s.selected=mode==='ratings'?['CheckSimExists','Finalize, Exit Test Mode','Interfaces, Reset Circuit']:['R101 · Input Voltage 1.8V @ 500mA','R205 · Output Resistance','R415 · Test Signal','C301 · Output Capacity'];s.sampleCount=mode==='ratings'?30:10;s.trials=3;s.ran=false;s.customFilename=false;s.method=mode==='ratings'?'attribute':'grr';s.result=s.selected[0];s.notice='';}
function navigation(dest){if(dest==='select'&&s.route!=='logs')return toast('Existing RawData starts at Analyze; there is no mapping step.');if(dest==='results'||dest==='report'){if(!s.ran)return toast('Run Analysis first.');}if(dest==='review'&&!s.selected.length)return toast('Select at least one measurement first.');s.screen=dest;render();}
function csv(rows,name){let str='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([str],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function rawExport(){let rows=[['Sample ID','File','Trial',...s.selected],...Array.from({length:nrows()},(_,i)=>['VSE'+String(Math.floor(i/s.trials)+1).padStart(6,'0'),String(Math.floor(i/s.trials)+1)+'_'+(i%s.trials+1)+'.xlsx',i%s.trials+1,...chosen().map(t=>row(t,i))])];csv(rows,'DataMapperX_RawData_DEMO.csv');toast('Exported demo CSV. Production target: RawData.xlsx.');}
function reportExport(){let rows=[['Test Item',...resultMetrics()],...chosen().filter(t=>s.runMethod==='attribute'||numeric(t)).map(t=>[t.id,...resultData(t)])];csv(rows,'DataMapperX_Statistical_Report_DEMO.csv');toast('Exported demo statistics CSV — illustrative values only.');}
root.addEventListener('click',ev=>{let el=ev.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id;switch(a){case 'home':s.screen='dashboard';s.route='dashboard';break;
case 'theme':s.dark=!s.dark;break;case 'start-logs':initLogs();break;case 'start-raw':initRaw('numeric');break;case 'start-ratings':initRaw('ratings');break;case 'navigate':navigation(el.dataset.step);return;case 'browse-raw':{let inp=root.querySelector('#userRawFile');if(inp)inp.click();return;}case 'scan':s.scanned=true;s.ran=false;toast('Demo scan complete — select measurements with +.');return;case 'add':if(!s.selected.includes(id))s.selected.push(id);break;case 'add-all':{let allowed=tests.filter(x=>s.logSet==='ict'?['R101','R205','R415','C301'].includes(x.id):!['R101','R205','R415','C301'].includes(x.id));for(let t of allowed){if(!s.selected.includes(t.id)&&t.id.toLowerCase().includes(s.filter.toLowerCase()))s.selected.push(t.id);}break;}case 'remove':s.selected=s.selected.filter(x=>x!==id);break;case 'clear':s.selected=[];break;case 'up':case 'down':{let i=s.selected.indexOf(id),j=i+(a==='up'?-1:1);if(j>=0&&j<s.selected.length)[s.selected[i],s.selected[j]]=[s.selected[j],s.selected[i]];break;}case 'to-review':case 'back-review':navigation('review');return;case 'back-select':navigation('select');return;case 'to-analyze':navigation('analyze');return;case 'to-results':navigation('results');return;case 'to-report':navigation('report');return;case 'review-tab':s.reviewTab=el.dataset.tab;break;case 'criteria':s.modal='criteria';break;case 'about-method':s.aboutMethod=s.screen==='results'&&s.runMethod?s.runMethod:s.method;s.aboutTab='calculation';s.modal='method';break;case 'about-method-switch':s.aboutMethod=el.dataset.method;s.aboutTab='calculation';break;case 'about-tab':s.aboutTab=el.dataset.tab;break;case 'criteria-reset':s.criteria={sv:{on:true,pass:10,fail:30},svtol:{on:true,pass:10,fail:30},ndc:{on:true,min:5}};break;case 'close-modal':s.modal=null;break;case 'criteria-apply':{let inputs=root.querySelectorAll('[data-criteria]');let v=JSON.parse(JSON.stringify(s.criteria));for(let inp of inputs){let [k,p]=inp.dataset.criteria.split('.');v[k][p]=inp.type==='checkbox'?inp.checked:parseFloat(inp.value);}let invalid=['sv','svtol'].some(k=>!Number.isFinite(v[k].pass)||!Number.isFinite(v[k].fail)||v[k].pass<0||v[k].fail<=v[k].pass)||!Number.isFinite(v.ndc.min)||v.ndc.min<1;if(invalid){let e=root.querySelector('#criteria-error');e.style.display='block';e.textContent='Invalid thresholds: FAIL above must be greater than PASS up to; NDC minimum must be at least 1.';return;}s.criteria=v;s.modal=null;toast('Pre-check criteria updated. Table grades have been recalculated.');return;}case 'reset-limits':s.bounds={};toast('Restored demo specification limits.');return;case 'method':s.method=el.dataset.method;s.ran=false;break;case 'run':if(!ready())return toast('Dataset incompatible with selected analysis method.');s.ran=true;s.runMethod=s.method;s.result=chosen().find(t=>s.method==='attribute'||numeric(t))?.id||s.selected[0];s.resultsTab='charts';s.screen='results';break;case 'results-tab':s.resultsTab=el.dataset.tab;break;case 'result-item':s.result=id;break;case 'raw-export':rawExport();return;case 'report-export':reportExport();return;case 'print-report':document.getElementById('print-only').innerHTML=paper();window.print();return;}render();});
root.addEventListener('input',ev=>{let el=ev.target,field=el.dataset.input;if(field==='filter'){s.filter=el.value;let pos=el.selectionStart;render();let inp=root.querySelector('#search');if(inp){inp.focus();inp.setSelectionRange(pos,pos);}return;}if(['reportName','reporter'].includes(field)){s[field]=el.value;let pos=el.selectionStart;render();let inp=root.querySelector('#'+field);if(inp){inp.focus();inp.setSelectionRange(pos,pos);}return;}if(field==='cpkTarget')s.cpkTarget=parseFloat(el.value);});
root.addEventListener('change',ev=>{let el=ev.target;if(el.id==='userRawFile'){let f=el.files&&el.files[0];if(f){s.importName=f.name;s.customFilename=true;toast('File selected for UX preview only. Demo calculations still use synthetic data.');}return;}if(el.dataset.select){let field=el.dataset.select;s[field]=el.value;if(field==='logSet'){s.selected=[];s.filter='';}s.ran=false;render();return;}if(el.dataset.bound){let id=el.dataset.id,key=el.dataset.bound;let n=el.value.trim()===''?null:Number(el.value);if(!s.bounds[id])s.bounds[id]={};s.bounds[id][key]=n;render();return;}if(el.dataset.check){s[el.dataset.check]=el.checked;render();return;}if(el.dataset.input){let field=el.dataset.input;if(['trials','sampleCount','ci','studyVar'].includes(field)){s[field]=Math.max(field==='trials'?1:field==='sampleCount'?2:1,Number(el.value)||1);s.ran=false;render();}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){s.modal=null;render();}});
render();
})();
</script></body></html>
