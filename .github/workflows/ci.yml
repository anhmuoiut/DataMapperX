name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: |
          python -m pytest --tb=short -rfE 2>&1 | Tee-Object -FilePath pytest-output.txt
          exit $LASTEXITCODE

      # GitHub shows a job's log only to people who are signed in; an annotation is on the commit's checks page for everyone.
      - name: Say which tests failed
        if: failure()
        run: python tools/ci_annotate.py pytest-output.txt
